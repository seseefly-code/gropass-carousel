<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Cover — Case</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    position: relative; padding: 84px 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .label {
    background: var(--primary); color: #FFFFFF;
    padding: 14px 24px; border-radius: 999px;
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  }
  .week { color: #64748B; font-size: 22px; font-weight: 500; }

  .quote-card {
    background: #FFFFFF;
    border-left: 8px solid var(--accent);
    border-radius: 0 32px 32px 0;
    box-shadow: 0 24px 60px -20px rgba(15,23,42,0.18);
    padding: 64px 68px 60px;
    margin-top: 20px;
    position: relative;
  }
  .quote-mark {
    position: absolute; top: -36px; left: 56px;
    color: var(--accent); font-size: 180px; font-weight: 900;
    font-family: Georgia, serif; line-height: 1;
  }
  .quote-text {
    color: var(--primary); font-size: 56px; font-weight: 800;
    line-height: 1.35; letter-spacing: -0.03em;
  }
  .quote-text em {
    font-style: normal;
    background: linear-gradient(180deg, transparent 65%, var(--highlight) 65%);
    padding: 0 4px;
  }
  .att {
    margin-top: 36px; display: flex; align-items: center; gap: 14px;
    color: #64748B; font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  }
  .att-line { width: 40px; height: 2px; background: var(--accent); }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .brand-mark { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 180px; filter: brightness(0); }
  .brand-domain { color: #94A3B8; font-size: 20px; font-weight: 600; }
  .swipe { color: var(--accent); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .swipe-arrow {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #FFFFFF;
    display: inline-flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .badge-row { display: flex; gap: 12px; margin-top: 24px; }
  .case-tag {
    background: rgba(99,102,241,0.1); color: var(--accent);
    padding: 10px 18px; border-radius: 12px;
    font-size: 20px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="top">
      <div class="label">매칭 케이스</div>
      <div class="week">2026년 5월 2주차</div>
    </div>

    <div class="quote-card">
      <div class="quote-mark">"</div>
      <div class="quote-text">우리 업종엔<br>정책자금이 없을 거라<br>생각했는데<em>받았어요</em></div>
      <div class="att"><span class="att-line"></span>그로패스 매칭 케이스 5선</div>
      <div class="badge-row">
        <span class="case-tag">음식점</span>
        <span class="case-tag">제조</span>
        <span class="case-tag">뷰티</span>
        <span class="case-tag">+ 2</span>
      </div>
    </div>

    <div class="bottom">
      <div class="brand-mark">
        <img src="logo.png" alt="GroPass" class="brand-logo">
        <div class="brand-domain">gropass.co.kr</div>
      </div>
      <div class="swipe">케이스 보기 <span class="swipe-arrow">→</span></div>
    </div>
  </div>
</body>
</html>
