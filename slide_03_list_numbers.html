<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>List — Numbers (인포그래픽)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, var(--primary) 0%, var(--dark-bg) 100%);
    padding: 84px 88px; color: #FFFFFF;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .header { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .crumb { color: rgba(255,255,255,0.6); font-size: 22px; font-weight: 500; }
  .pager { color: rgba(255,255,255,0.6); font-size: 22px; font-weight: 600; }
  .pager strong { color: #FFFFFF; font-weight: 700; }

  .title-block { margin-top: 24px; position: relative; }
  .eyebrow { color: var(--highlight); font-size: 26px; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 14px; }
  .title { color: #FFFFFF; font-size: 52px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
  .title em { font-style: normal; color: var(--highlight); }

  .list { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; position: relative; }
  .item {
    display: flex; align-items: center; gap: 24px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border-radius: 16px; padding: 20px 24px;
  }
  .item-num {
    flex-shrink: 0;
    color: var(--highlight); font-size: 56px; font-weight: 900;
    line-height: 1; letter-spacing: -0.04em;
    min-width: 200px;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-name { color: #FFFFFF; font-size: 22px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
  .item-desc { color: rgba(255,255,255,0.55); font-size: 16px; font-weight: 500; line-height: 1.4; margin-top: 4px; }
  .item-meta { flex-shrink: 0; }
  .item-amount {
    color: rgba(255,255,255,0.4); font-size: 14px; font-weight: 600;
    background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px;
  }

  .footer { margin-top: auto; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; position: relative; border-top: 1px solid rgba(255,255,255,0.1); }
  .footer-brand { display: flex; align-items: center; gap: 10px; }
  .footer-logo { width: 130px; filter: brightness(0) invert(1); opacity: 0.92; }
  .footer-domain { color: rgba(255,255,255,0.5); font-size: 18px; font-weight: 600; }
  .footer-hint { color: rgba(255,255,255,0.6); font-size: 20px; font-weight: 500; }
</style>
</head>
<body>
  <div class="slide">
    <div class="grid-bg"></div>
    <div class="header">
      <div class="crumb">핵심 숫자 · 한눈에</div>
      <div class="pager"><strong>03</strong> / 05</div>
    </div>

    <div class="title-block">
      <div class="eyebrow">KEY NUMBERS</div>
      <h1 class="title">사장님이 알아야 할<br><em>5가지 숫자</em></h1>
    </div>

    <div class="list">
      <div class="item"><div class="item-num">30조원</div><div class="item-body"><div class="item-name">올해 정부 정책자금 총액</div><div class="item-desc">전년 대비 +8%</div></div><div class="item-meta"><div class="item-amount">예산</div></div></div>
      <div class="item"><div class="item-num">12조원</div><div class="item-body"><div class="item-name">매년 미집행으로 사라지는 금액</div><div class="item-desc">전체의 약 40%</div></div><div class="item-meta"><div class="item-amount">손실</div></div></div>
      <div class="item"><div class="item-num">3년</div><div class="item-body"><div class="item-name">창업 기준 자금 풀이 바뀌는 시점</div><div class="item-desc">예비/초기/도약 단계</div></div><div class="item-meta"><div class="item-amount">기준</div></div></div>
      <div class="item"><div class="item-num">D-14</div><div class="item-body"><div class="item-name">평균 신청 마감까지</div><div class="item-desc">서류 준비엔 빠듯</div></div><div class="item-meta"><div class="item-amount">평균</div></div></div>
      <div class="item"><div class="item-num">5분</div><div class="item-body"><div class="item-name">자금 1건 검토 시간</div><div class="item-desc">45개 직접 보면 4시간</div></div><div class="item-meta"><div class="item-amount">현실</div></div></div>
    </div>

    <div class="footer">
      <div class="footer-brand"><img src="logo.png" alt="" class="footer-logo"><div class="footer-domain">gropass.co.kr</div></div>
      <div class="footer-hint">상세는 마지막 장에서 →</div>
    </div>
  </div>
</body>
</html>
