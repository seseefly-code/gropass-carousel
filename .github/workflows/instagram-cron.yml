name: Instagram Carousel Daily

on:
  schedule:
    # 매일 07:30 KST = UTC 22:30 (전날) — Threads early_morning(07:00)과 30분 분리
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '주제 (생략 시 요일별 자동)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: instagram-cron
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (Puppeteer + deps)
        run: npm install

      - name: Determine topic by weekday (KST)
        id: topic
        run: |
          MANUAL_TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$MANUAL_TOPIC" ]; then
            TOPIC="$MANUAL_TOPIC"
            echo "수동 주제: $TOPIC"
          else
            DOW=$(TZ=Asia/Seoul date +%u)  # 1=월 ~ 7=일
            case "$DOW" in
              # 월 - 마감 임박 (공고형)
              1) TOPIC="이번 주 마감 임박 정책자금 5선" ;;
              # 화 - 신청 노하우 (인사이트형) — 5개 자주 놓치는 포인트
              2) TOPIC="정책자금 신청 시 사장님들이 자주 놓치는 5가지 포인트" ;;
              # 수 - 업종별 (음식점/제조/IT/도소매/서비스 중 1개씩 회전)
              3) TOPIC="음식점·카페 사장님이 챙겨야 할 정책자금 5선" ;;
              # 목 - 매칭 케이스 (사례형) — 5개 익명 사례
              4) TOPIC="최근 매칭된 사장님 케이스 5가지 — 어떤 자금 받았나" ;;
              # 금 - 이번 주 새로 뜬 공고 (신규형)
              5) TOPIC="이번 주 신청 시작한 정책자금 모음 5선" ;;
              # 토 - 숫자/통계 (팩트형) — 5개 정책자금 핵심 숫자
              6) TOPIC="사장님이 알아야 할 정책자금 핵심 숫자 5가지" ;;
              # 일 - Q&A (자주 묻는 질문) — 5개 FAQ
              7) TOPIC="정책자금 자주 묻는 질문 5가지 — 사장님 1주일 정리" ;;
            esac
            echo "요일별 자동 주제 (DOW=$DOW): $TOPIC"
          fi
          echo "topic=$TOPIC" >> $GITHUB_OUTPUT

      - name: Crawl latest announcements
        run: node crawl.js
        continue-on-error: true

      - name: Generate carousel content (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate.js "${{ steps.topic.outputs.topic }}"

      - name: Detect carousel_id from latest data file
        id: detect
        run: |
          LATEST=$(ls -t data/*.json 2>/dev/null | grep -v 'announcements' | head -1)
          if [ -z "$LATEST" ]; then
            echo "❌ data/*.json 파일을 찾을 수 없음"
            exit 1
          fi
          CAROUSEL_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$LATEST', 'utf-8')).carousel_id)")
          echo "data file: $LATEST"
          echo "carousel_id: $CAROUSEL_ID"
          echo "data_file=$LATEST" >> $GITHUB_OUTPUT
          echo "carousel_id=$CAROUSEL_ID" >> $GITHUB_OUTPUT

      - name: Render PNG slides (Puppeteer)
        run: node render.js "${{ steps.detect.outputs.data_file }}"

      - name: Commit and push (data + PNG)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Instagram Cron Bot"
          git add data/ out/
          if git diff --staged --quiet; then
            echo "변경사항 없음, skip commit"
          else
            git commit -m "auto-post: instagram carousel ${{ steps.detect.outputs.carousel_id }} ($(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M))"
            git push origin main
          fi

      - name: Post to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node post_carousel.js --carousel-id="${{ steps.detect.outputs.carousel_id }}"

      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "주제      : ${{ steps.topic.outputs.topic }}"
          echo "carousel  : ${{ steps.detect.outputs.carousel_id }}"
          echo "결과      : ${{ job.status }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
