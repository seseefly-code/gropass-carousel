name: Threads Auto-Post

on:
  schedule:
    - cron: '0 22 * * *'    # 07:00 KST → early_morning
    - cron: '0 23 * * *'    # 08:00 KST → morning
    - cron: '0 1 * * *'     # 10:00 KST → late_morning
    - cron: '0 3 * * *'     # 12:00 KST → noon
    - cron: '0 4 * * *'     # 13:00 KST → lunch
    - cron: '0 6 * * *'     # 15:00 KST → afternoon
    - cron: '0 8 * * *'     # 17:00 KST → late_afternoon
    - cron: '0 10 * * *'    # 19:00 KST → evening
    - cron: '0 12 * * *'    # 21:00 KST → late_evening
    - cron: '0 13 * * *'    # 22:00 KST → night
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        description: '게시 슬롯'
        options: [early_morning, morning, late_morning, noon, lunch, afternoon, late_afternoon, evening, late_evening, night]
        default: morning
      dry_run:
        type: boolean
        description: 'dry-run (생성만, 게시 안함)'
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore .threads-token.json from base64 secret
        env:
          TOKEN_B64: ${{ secrets.THREADS_TOKEN_B64 }}
        run: |
          if [ -z "$TOKEN_B64" ]; then
            echo "::error::THREADS_TOKEN_B64 secret is missing"
            exit 1
          fi
          printf '%s' "$TOKEN_B64" | base64 -d > .threads-token.json
          # JSON 검증
          node -e "JSON.parse(require('fs').readFileSync('.threads-token.json','utf-8'))" || {
            echo "::error::Restored .threads-token.json is not valid JSON"
            exit 1
          }
          echo "Token file restored (size: $(wc -c < .threads-token.json) bytes)"

      - name: Determine slot
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") SLOT=early_morning ;;
              "0 23 * * *") SLOT=morning ;;
              "0 1 * * *")  SLOT=late_morning ;;
              "0 3 * * *")  SLOT=noon ;;
              "0 4 * * *")  SLOT=lunch ;;
              "0 6 * * *")  SLOT=afternoon ;;
              "0 8 * * *")  SLOT=late_afternoon ;;
              "0 10 * * *") SLOT=evening ;;
              "0 12 * * *") SLOT=late_evening ;;
              "0 13 * * *") SLOT=night ;;
              *) echo "::error::Unknown cron schedule"; exit 1 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Slot: $SLOT"

      - name: Refresh announcements (best effort)
        continue-on-error: true
        run: node crawl.js --pages=2

      - name: Run auto_post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          node auto_post.js --slot=${{ steps.pick.outputs.slot }} $DRY

      - name: Wipe token file before commit
        if: always()
        run: rm -f .threads-token.json

      - name: Commit state changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .post_state.json threads/ data/announcements/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto-post: ${{ steps.pick.outputs.slot }} $(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M)"
            git push
          fi
