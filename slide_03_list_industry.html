<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>List — Industry (업종 카드)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, #FFFBEB 0%, #FFFFFF 100%);
    padding: 84px 88px;
    display: flex; flex-direction: column;
  }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .crumb { color: #64748B; font-size: 22px; font-weight: 500; }
  .pager { color: #94A3B8; font-size: 22px; font-weight: 600; }
  .pager strong { color: var(--primary); font-weight: 700; }

  .title-block { margin-top: 32px; }
  .eyebrow { color: var(--accent); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }
  .title { color: var(--primary); font-size: 56px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
  .title em { font-style: normal; color: var(--accent); }

  .list { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; }
  .item {
    display: flex; align-items: center; gap: 22px;
    background: #FFFFFF; border-radius: 18px; padding: 20px 24px;
    border: 2px solid #FED7AA;
  }
  .item-num {
    flex-shrink: 0;
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-name { color: var(--primary); font-size: 26px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
  .item-desc { color: #64748B; font-size: 18px; font-weight: 500; line-height: 1.45; margin-top: 6px; }
  .item-meta { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .item-amount { color: var(--accent); font-size: 22px; font-weight: 800; }
  .item-deadline { color: #94A3B8; font-size: 16px; font-weight: 600; }

  .footer { margin-top: auto; padding-top: 24px; display: flex; justify-content: space-between; align-items: center; }
  .footer-brand { display: flex; align-items: center; gap: 10px; }
  .footer-logo { width: 130px; filter: brightness(0); }
  .footer-domain { color: #94A3B8; font-size: 18px; font-weight: 600; }
  .footer-hint { color: #64748B; font-size: 20px; font-weight: 500; }
</style>
</head>
<body>
  <div class="slide">
    <div class="header">
      <div class="crumb">업종별 정책자금 · 한눈에</div>
      <div class="pager"><strong>03</strong> / 05</div>
    </div>

    <div class="title-block">
      <div class="eyebrow">CAFE · RESTAURANT</div>
      <h1 class="title">카페·식당 사장님<br><em>딱 맞는 5선</em></h1>
    </div>

    <div class="list">
      <div class="item"><div class="item-num">☕</div><div class="item-body"><div class="item-name">소상공인 디지털 전환</div><div class="item-desc">소진공 · 매출 10억 미만</div></div><div class="item-meta"><div class="item-amount">최대 700만</div><div class="item-deadline">D-23</div></div></div>
      <div class="item"><div class="item-num">🍰</div><div class="item-body"><div class="item-name">관광진흥개발기금 융자</div><div class="item-desc">한국관광공사 · 관광업 등록</div></div><div class="item-meta"><div class="item-amount">저금리 융자</div><div class="item-deadline">D-7</div></div></div>
      <div class="item"><div class="item-num">🥘</div><div class="item-body"><div class="item-name">혁신바우처 (채용지원)</div><div class="item-desc">중기부 · 신규 채용 계획</div></div><div class="item-meta"><div class="item-amount">채용비용</div><div class="item-deadline">D-5</div></div></div>
      <div class="item"><div class="item-num">📦</div><div class="item-body"><div class="item-name">서울 소상공인 온라인 판로</div><div class="item-desc">서울 소재 · 오프라인 가게</div></div><div class="item-meta"><div class="item-amount">판로 지원</div><div class="item-deadline">D-17</div></div></div>
      <div class="item"><div class="item-num">©️</div><div class="item-body"><div class="item-name">IP 나래 프로그램</div><div class="item-desc">상표·디자인 미보유 가게</div></div><div class="item-meta"><div class="item-amount">IP 등록비</div><div class="item-deadline">상시</div></div></div>
    </div>

    <div class="footer">
      <div class="footer-brand"><img src="logo.png" alt="" class="footer-logo"><div class="footer-domain">gropass.co.kr</div></div>
      <div class="footer-hint">상세는 마지막 장에서 →</div>
    </div>
  </div>
</body>
</html>
