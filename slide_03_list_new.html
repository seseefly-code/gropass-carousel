<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>List — New (NEW 배지)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, #ECFEFF 0%, #FFFFFF 60%, #F0F9FF 100%);
    padding: 84px 88px;
    display: flex; flex-direction: column;
  }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .crumb { color: #64748B; font-size: 22px; font-weight: 500; }
  .pager { color: #94A3B8; font-size: 22px; font-weight: 600; }
  .pager strong { color: var(--primary); font-weight: 700; }

  .title-block { margin-top: 32px; }
  .eyebrow { color: var(--accent); font-size: 26px; font-weight: 800; letter-spacing: 0.06em; margin-bottom: 16px; }
  .title { color: var(--primary); font-size: 56px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
  .title em { font-style: normal; color: var(--accent); }

  .list { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; }
  .item {
    position: relative;
    display: flex; align-items: center; gap: 22px;
    background: #FFFFFF; border-radius: 18px; padding: 22px 26px;
    border: 2px solid rgba(6,182,212,0.2);
    box-shadow: 0 6px 16px -10px rgba(6,182,212,0.25);
  }
  .item-num {
    flex-shrink: 0;
    background: var(--accent); color: #FFFFFF;
    padding: 8px 14px; border-radius: 10px;
    font-size: 18px; font-weight: 900; letter-spacing: 0.06em;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-name { color: var(--primary); font-size: 26px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
  .item-desc { color: #64748B; font-size: 18px; font-weight: 500; line-height: 1.45; margin-top: 6px; }
  .item-meta { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .item-amount { color: var(--accent); font-size: 22px; font-weight: 800; }
  .item-deadline { color: #94A3B8; font-size: 16px; font-weight: 600; }

  .footer { margin-top: auto; padding-top: 24px; display: flex; justify-content: space-between; align-items: center; }
  .footer-brand { display: flex; align-items: center; gap: 10px; }
  .footer-logo { width: 130px; filter: brightness(0); }
  .footer-domain { color: #94A3B8; font-size: 18px; font-weight: 600; }
  .footer-hint { color: #64748B; font-size: 20px; font-weight: 500; }
</style>
</head>
<body>
  <div class="slide">
    <div class="header">
      <div class="crumb">이번 주 신규 · 한눈에</div>
      <div class="pager"><strong>03</strong> / 05</div>
    </div>

    <div class="title-block">
      <div class="eyebrow">JUST OPENED</div>
      <h1 class="title">5/4~5/6 새로 뜬<br><em>이번 주 5건</em></h1>
    </div>

    <div class="list">
      <div class="item"><div class="item-num">NEW</div><div class="item-body"><div class="item-name">중동진출 테크 중기 지원</div><div class="item-desc">중기부 · 5/4 시작</div></div><div class="item-meta"><div class="item-amount">패키지</div><div class="item-deadline">D-7</div></div></div>
      <div class="item"><div class="item-num">NEW</div><div class="item-body"><div class="item-name">미주 K-뷰티 진출 프로그램</div><div class="item-desc">중기부 · 5/5 시작</div></div><div class="item-meta"><div class="item-amount">유통연계</div><div class="item-deadline">D-10</div></div></div>
      <div class="item"><div class="item-num">NEW</div><div class="item-body"><div class="item-name">뉴욕 K-소비재 물류 패키지</div><div class="item-desc">KOTRA · 5/5 시작</div></div><div class="item-meta"><div class="item-amount">물류 패키지</div><div class="item-deadline">D-9</div></div></div>
      <div class="item"><div class="item-num">NEW</div><div class="item-body"><div class="item-name">제조 디지털 전환 고도화</div><div class="item-desc">부산 금정 · 5/6 시작</div></div><div class="item-meta"><div class="item-amount">기술고도화</div><div class="item-deadline">D-11</div></div></div>
      <div class="item"><div class="item-num">NEW</div><div class="item-body"><div class="item-name">기상·기후테크 창업 공모</div><div class="item-desc">부산대 · 5/6 시작</div></div><div class="item-meta"><div class="item-amount">사업화</div><div class="item-deadline">D-14</div></div></div>
    </div>

    <div class="footer">
      <div class="footer-brand"><img src="logo.png" alt="" class="footer-logo"><div class="footer-domain">gropass.co.kr</div></div>
      <div class="footer-hint">상세는 마지막 장에서 →</div>
    </div>
  </div>
</body>
</html>
