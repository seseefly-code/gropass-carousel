<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Cover — FAQ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, #FAF5FF 0%, #F3E8FF 100%);
    position: relative; padding: 84px 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .deco-blob {
    position: absolute; bottom: -180px; left: -180px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: 0.18;
  }
  .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .label {
    background: var(--primary); color: #FFFFFF;
    padding: 14px 24px; border-radius: 999px;
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  }
  .week { color: #64748B; font-size: 22px; font-weight: 500; }

  .qa-stage { position: relative; margin-top: 40px; }
  .q-row { display: flex; gap: 28px; align-items: flex-start; }
  .q-mark {
    flex-shrink: 0;
    color: var(--accent); font-size: 200px; font-weight: 900;
    line-height: 0.85; letter-spacing: -0.05em;
  }
  .q-text {
    color: var(--primary); font-size: 64px; font-weight: 800;
    line-height: 1.25; letter-spacing: -0.03em;
    margin-top: 24px;
  }
  .q-text em {
    font-style: normal;
    background: linear-gradient(180deg, transparent 65%, var(--highlight) 65%);
    padding: 0 4px;
  }

  .a-card {
    background: #FFFFFF;
    border-radius: 24px;
    padding: 32px 36px;
    margin-top: 56px;
    box-shadow: 0 12px 32px -12px rgba(88,28,135,0.15);
    border: 1px solid rgba(147,51,234,0.15);
  }
  .a-mark {
    color: var(--accent); font-size: 28px; font-weight: 800;
    letter-spacing: -0.02em; margin-bottom: 8px;
  }
  .a-text {
    color: #475569; font-size: 26px; font-weight: 500;
    line-height: 1.55; letter-spacing: -0.015em;
  }
  .a-text strong { color: var(--primary); font-weight: 700; }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; position: relative; }
  .brand-mark { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 180px; filter: brightness(0); }
  .brand-domain { color: #94A3B8; font-size: 20px; font-weight: 600; }
  .swipe { color: var(--accent); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .swipe-arrow {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #FFFFFF;
    display: inline-flex; align-items: center; justify-content: center; font-size: 28px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="deco-blob"></div>
    <div class="top">
      <div class="label">자주 묻는 질문</div>
      <div class="week">2026년 5월 2주차</div>
    </div>

    <div class="qa-stage">
      <div class="q-row">
        <div class="q-mark">Q.</div>
        <div class="q-text">폐업 이력 있어도<br>정책자금<em>받을 수 있나요</em>?</div>
      </div>
      <div class="a-card">
        <div class="a-mark">A.</div>
        <div class="a-text">네, <strong>일부 자금은 가능합니다.</strong><br>창업 3개월차도 길이 있어요.</div>
      </div>
    </div>

    <div class="bottom">
      <div class="brand-mark">
        <img src="logo.png" alt="GroPass" class="brand-logo">
        <div class="brand-domain">gropass.co.kr</div>
      </div>
      <div class="swipe">질문 5개 보기 <span class="swipe-arrow">→</span></div>
    </div>
  </div>
</body>
</html>
