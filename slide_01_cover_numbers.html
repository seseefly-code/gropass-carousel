<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Cover — Numbers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--dark-bg) 100%);
    position: relative; padding: 84px 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #FFFFFF; overflow: hidden;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .label {
    background: var(--accent); color: #FFFFFF;
    padding: 14px 24px; border-radius: 999px;
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  }
  .week { color: rgba(255,255,255,0.6); font-size: 22px; font-weight: 500; }

  .number-stage { position: relative; text-align: center; margin: auto 0; }
  .stage-eyebrow {
    color: var(--highlight); font-size: 28px; font-weight: 700;
    letter-spacing: 0.15em; margin-bottom: 24px;
  }
  .big-number {
    font-size: 360px; font-weight: 900;
    line-height: 0.9; letter-spacing: -0.06em;
    color: #FFFFFF;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--accent) 80%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .big-unit {
    font-size: 80px; font-weight: 800; color: var(--highlight);
    margin-left: -20px; letter-spacing: -0.04em;
  }
  .stage-sub {
    color: rgba(255,255,255,0.85); font-size: 38px; font-weight: 600;
    line-height: 1.4; letter-spacing: -0.02em; margin-top: 32px;
    max-width: 760px; margin-left: auto; margin-right: auto;
  }
  .stage-sub em {
    font-style: normal; color: var(--highlight);
    background: linear-gradient(180deg, transparent 65%, rgba(252,211,77,0.25) 65%);
    padding: 0 4px;
  }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; position: relative; }
  .brand-mark { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 180px; filter: brightness(0) invert(1); opacity: 0.92; }
  .brand-domain { color: rgba(255,255,255,0.45); font-size: 20px; font-weight: 600; }
  .swipe { color: var(--highlight); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .swipe-arrow {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #FFFFFF;
    display: inline-flex; align-items: center; justify-content: center; font-size: 28px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="grid-bg"></div>
    <div class="top">
      <div class="label">정책자금 핵심 숫자</div>
      <div class="week">2026년 5월 2주차</div>
    </div>

    <div class="number-stage">
      <div class="stage-eyebrow">알아야 할 숫자</div>
      <div class="big-number">30<span class="big-unit">조원</span></div>
      <p class="stage-sub">올해 정부가 푸는 정책자금.<br>이 중 <em>12조</em>는 매년 미집행돼요.</p>
    </div>

    <div class="bottom">
      <div class="brand-mark">
        <img src="logo.png" alt="GroPass" class="brand-logo">
        <div class="brand-domain">gropass.co.kr</div>
      </div>
      <div class="swipe">숫자 5개 보기 <span class="swipe-arrow">→</span></div>
    </div>
  </div>
</body>
</html>
