<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Cover — Tips</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 100%);
    position: relative; padding: 84px 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .label {
    background: var(--primary); color: #FFFFFF;
    padding: 14px 24px; border-radius: 999px;
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  }
  .week { color: #64748B; font-size: 22px; font-weight: 500; }

  .head-block { margin-top: 48px; }
  .eyebrow {
    color: var(--accent); font-size: 28px; font-weight: 700;
    letter-spacing: -0.02em; margin-bottom: 24px;
  }
  .headline {
    color: var(--primary); font-size: 88px; font-weight: 800;
    line-height: 1.18; letter-spacing: -0.03em;
  }
  .headline em {
    font-style: normal;
    background: linear-gradient(180deg, transparent 65%, var(--highlight) 65%);
    padding: 0 4px;
  }

  .check-list { margin-top: 56px; display: flex; flex-direction: column; gap: 20px; }
  .check-item {
    display: flex; align-items: center; gap: 24px;
    background: rgba(255,255,255,0.7); border: 2px solid rgba(16,185,129,0.2);
    border-radius: 18px; padding: 24px 28px;
    backdrop-filter: blur(4px);
  }
  .check-mark {
    flex-shrink: 0;
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900;
  }
  .check-text {
    color: var(--primary); font-size: 32px; font-weight: 700;
    letter-spacing: -0.02em;
  }
  .check-text small {
    display: block;
    color: #64748B; font-size: 20px; font-weight: 500;
    letter-spacing: -0.01em; margin-top: 4px;
  }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .brand-mark { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 180px; filter: brightness(0); }
  .brand-domain { color: #94A3B8; font-size: 20px; font-weight: 600; }
  .swipe { color: var(--accent); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .swipe-arrow {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #FFFFFF;
    display: inline-flex; align-items: center; justify-content: center; font-size: 28px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="top">
      <div class="label">신청 노하우</div>
      <div class="week">2026년 5월 2주차</div>
    </div>

    <div class="head-block">
      <div class="eyebrow">사장님이 자주 놓치는</div>
      <h1 class="headline">서류 다 냈는데<br><em>탈락한 이유</em>가<br>여기 있어요</h1>
    </div>

    <div class="check-list">
      <div class="check-item">
        <div class="check-mark">✓</div>
        <div class="check-text">창업일 기준 하루 차이</div>
      </div>
      <div class="check-item">
        <div class="check-mark">✓</div>
        <div class="check-text">마감 당일 18시 컷</div>
      </div>
      <div class="check-item">
        <div class="check-mark">✓</div>
        <div class="check-text">중복 수혜 제한 …외 2가지</div>
      </div>
    </div>

    <div class="bottom">
      <div class="brand-mark">
        <img src="logo.png" alt="GroPass" class="brand-logo">
        <div class="brand-domain">gropass.co.kr</div>
      </div>
      <div class="swipe">5가지 보기 <span class="swipe-arrow">→</span></div>
    </div>
  </div>
</body>
</html>
