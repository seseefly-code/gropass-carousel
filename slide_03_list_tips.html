<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>List — Tips (체크리스트)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
  .slide {
    width: 1080px; height: 1080px;
    background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 100%);
    padding: 84px 88px;
    display: flex; flex-direction: column;
  }
  .header { display: flex; justify-content: space-between; align-items: center; }
  .crumb { color: #64748B; font-size: 22px; font-weight: 500; }
  .pager { color: #94A3B8; font-size: 22px; font-weight: 600; }
  .pager strong { color: var(--primary); font-weight: 700; }

  .title-block { margin-top: 32px; }
  .eyebrow {
    color: var(--accent); font-size: 26px; font-weight: 700;
    letter-spacing: -0.02em; margin-bottom: 16px;
  }
  .title {
    color: var(--primary); font-size: 56px; font-weight: 800;
    line-height: 1.25; letter-spacing: -0.03em;
  }
  .title em { font-style: normal; color: var(--accent); }

  .list {
    margin-top: 36px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .item {
    display: flex; align-items: flex-start; gap: 22px;
    background: #FFFFFF;
    border-left: 6px solid var(--accent);
    border-radius: 0 16px 16px 0;
    padding: 22px 26px;
    box-shadow: 0 2px 8px -4px rgba(16,185,129,0.15);
  }
  .item-num {
    flex-shrink: 0;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--accent); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-name {
    color: var(--primary); font-size: 28px; font-weight: 700;
    letter-spacing: -0.015em; line-height: 1.3;
  }
  .item-desc {
    color: #64748B; font-size: 19px; font-weight: 500;
    letter-spacing: -0.01em; line-height: 1.5; margin-top: 6px;
  }

  .footer {
    margin-top: auto; padding-top: 24px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(16,185,129,0.2);
  }
  .footer-brand { display: flex; align-items: center; gap: 10px; }
  .footer-logo { width: 130px; filter: brightness(0); }
  .footer-domain { color: #94A3B8; font-size: 18px; font-weight: 600; }
  .footer-hint { color: #64748B; font-size: 20px; font-weight: 500; }
</style>
</head>
<body>
  <div class="slide">
    <div class="header">
      <div class="crumb">신청 노하우 · 체크리스트</div>
      <div class="pager"><strong>03</strong> / 05</div>
    </div>

    <div class="title-block">
      <div class="eyebrow">CHECKLIST</div>
      <h1 class="title">자주 놓치는<br><em>5가지 포인트</em></h1>
    </div>

    <div class="list">
      <div class="item"><div class="item-num">✓</div><div class="item-body"><div class="item-name">창업일 기준 하루 차이</div><div class="item-desc">자격 미달 흔함</div></div></div>
      <div class="item"><div class="item-num">✓</div><div class="item-body"><div class="item-name">마감 당일 18시 컷</div><div class="item-desc">새벽 1시 제출 X</div></div></div>
      <div class="item"><div class="item-num">✓</div><div class="item-body"><div class="item-name">중복 수혜 제한</div><div class="item-desc">공고 원문 한 번 더</div></div></div>
      <div class="item"><div class="item-num">✓</div><div class="item-body"><div class="item-name">서류 발급 시점 체크</div><div class="item-desc">증빙은 1주일 안</div></div></div>
      <div class="item"><div class="item-num">✓</div><div class="item-body"><div class="item-name">선정 후 사후 의무</div><div class="item-desc">6개월 보고도 필수</div></div></div>
    </div>

    <div class="footer">
      <div class="footer-brand"><img src="logo.png" alt="" class="footer-logo"><div class="footer-domain">gropass.co.kr</div></div>
      <div class="footer-hint">상세는 마지막 장에서 →</div>
    </div>
  </div>
</body>
</html>
